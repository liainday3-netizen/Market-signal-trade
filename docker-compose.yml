# Always-on VPS deployment: `docker compose up -d --build`
# Postgres + bot, both restart automatically after crashes or reboots.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mst
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mst
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mst"]
      interval: 10s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://mst:${POSTGRES_PASSWORD}@db:5432/mst
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"   # bind locally; put Caddy/nginx + HTTPS in front if exposing
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  pgdata:
