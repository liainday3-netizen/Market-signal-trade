openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AI Trader API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: trader
    description: AI Trader operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /trader/signal:
    get:
      operationId: getSignal
      tags: [trader]
      summary: Get current trading signal on demand
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            default: "BTC/USDT"
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            default: "1m"
      responses:
        "200":
          description: Trading signal with backtest stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /trader/history:
    get:
      operationId: getHistory
      tags: [trader]
      summary: Get signal history from DB
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: number
            default: 50
        - name: symbol
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Signal history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SignalRecord"
  /trader/market:
    get:
      operationId: getMarketData
      tags: [trader]
      summary: Get OHLCV market data
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            default: "BTC/USDT"
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            default: "1m"
        - name: limit
          in: query
          required: false
          schema:
            type: number
            default: 50
      responses:
        "200":
          description: Market data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candle"
  /trader/status:
    get:
      operationId: getAutoTraderStatus
      tags: [trader]
      summary: Get auto-trader loop status
      responses:
        "200":
          description: Auto-trader loop state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoTraderStatus"
    post:
      operationId: controlAutoTrader
      tags: [trader]
      summary: Start or stop the auto-trader loop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoTraderControl"
      responses:
        "200":
          description: Updated auto-trader state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoTraderStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AutoTraderStatus:
      type: object
      properties:
        isRunning:
          type: boolean
        intervalSeconds:
          type: number
        totalRuns:
          type: number
        signalsGenerated:
          type: number
        lastRun:
          type: string
          nullable: true
        nextRun:
          type: string
          nullable: true
        activeSymbols:
          type: array
          items:
            type: string
        lastSignals:
          type: array
          items:
            $ref: "#/components/schemas/RecentSignal"
      required:
        - isRunning
        - intervalSeconds
        - totalRuns
        - signalsGenerated
        - activeSymbols
        - lastSignals
    AutoTraderControl:
      type: object
      properties:
        action:
          type: string
          enum: [start, stop]
        intervalSeconds:
          type: number
      required:
        - action
    RecentSignal:
      type: object
      properties:
        symbol:
          type: string
        signal:
          type: string
        confidence:
          type: number
        price:
          type: number
        composite:
          type: number
        timestamp:
          type: string
      required:
        - symbol
        - signal
        - confidence
        - price
        - composite
        - timestamp
    SignalResponse:
      type: object
      properties:
        signal:
          type: string
          enum: [BUY, SELL, HOLD]
        confidence:
          type: number
        price:
          type: number
        symbol:
          type: string
        timeframe:
          type: string
        timestamp:
          type: string
        features:
          $ref: "#/components/schemas/Features"
        factorScores:
          $ref: "#/components/schemas/FactorScores"
        backtest:
          $ref: "#/components/schemas/BacktestStats"
      required:
        - signal
        - confidence
        - price
        - symbol
        - timeframe
        - timestamp
        - features
        - factorScores
        - backtest
    Features:
      type: object
      properties:
        returns:
          type: number
        ma20:
          type: number
        emaFast:
          type: number
        emaSlow:
          type: number
        volatility:
          type: number
        rsi:
          type: number
        macd:
          type: number
        macdSignal:
          type: number
        macdHist:
          type: number
        bbUpper:
          type: number
        bbLower:
          type: number
        bbPct:
          type: number
        atr:
          type: number
        stochK:
          type: number
        stochD:
          type: number
        momentum:
          type: number
        zScore:
          type: number
        volumeTrend:
          type: number
      required:
        - returns
        - ma20
        - emaFast
        - emaSlow
        - volatility
        - rsi
        - macd
        - macdSignal
        - macdHist
        - bbUpper
        - bbLower
        - bbPct
        - atr
        - stochK
        - stochD
        - momentum
        - zScore
        - volumeTrend
    FactorScores:
      type: object
      properties:
        trend:
          type: number
        momentum:
          type: number
        meanReversion:
          type: number
        volatility:
          type: number
        volume:
          type: number
        composite:
          type: number
      required:
        - trend
        - momentum
        - meanReversion
        - volatility
        - volume
        - composite
    BacktestStats:
      type: object
      properties:
        winRate:
          type: number
        avgReturn:
          type: number
        sharpeRatio:
          type: number
        maxDrawdown:
          type: number
        totalTrades:
          type: number
        profitFactor:
          type: number
      required:
        - winRate
        - avgReturn
        - sharpeRatio
        - maxDrawdown
        - totalTrades
        - profitFactor
    SignalRecord:
      type: object
      properties:
        id:
          type: number
        signal:
          type: string
        confidence:
          type: number
        price:
          type: number
        symbol:
          type: string
        timeframe:
          type: string
        returns:
          type: number
        ma:
          type: number
        volatility:
          type: number
        rsi:
          type: number
        macd:
          type: number
        createdAt:
          type: string
      required:
        - id
        - signal
        - confidence
        - price
        - symbol
        - timeframe
        - returns
        - ma
        - volatility
        - rsi
        - macd
        - createdAt
    Candle:
      type: object
      properties:
        time:
          type: number
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number
      required:
        - time
        - open
        - high
        - low
        - close
        - volume
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
