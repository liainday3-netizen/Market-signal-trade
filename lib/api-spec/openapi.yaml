openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AI Trader API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: trader
    description: AI Trader operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /trader/signal:
    get:
      operationId: getSignal
      tags: [trader]
      summary: Get current trading signal on demand
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            default: "BTC/USDT"
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            default: "1m"
      responses:
        "200":
          description: Trading signal with backtest stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /trader/history:
    get:
      operationId: getHistory
      tags: [trader]
      summary: Get signal history from DB
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: number
            default: 50
        - name: symbol
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Signal history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SignalRecord"
  /trader/market:
    get:
      operationId: getMarketData
      tags: [trader]
      summary: Get OHLCV market data
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            default: "BTC/USDT"
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            default: "1m"
        - name: limit
          in: query
          required: false
          schema:
            type: number
            default: 50
      responses:
        "200":
          description: Market data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candle"
  /trader/portfolio:
    get:
      operationId: getPortfolio
      tags: [trader]
      summary: Get paper trading portfolio snapshot
      responses:
        "200":
          description: Portfolio snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSnapshot"
  /trader/portfolio/reset:
    post:
      operationId: resetPortfolio
      tags: [trader]
      summary: Reset paper portfolio to starting capital
      responses:
        "200":
          description: Reset portfolio snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSnapshot"
  /trader/live-mode:
    get:
      operationId: getLiveMode
      tags: [trader]
      summary: Get live trading mode state
      responses:
        "200":
          description: Live trader state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveTraderState"
    post:
      operationId: setLiveMode
      tags: [trader]
      summary: Enable or disable live trading mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveModeControl"
      responses:
        "200":
          description: Updated live trader state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveTraderState"
        "400":
          description: Error (e.g. keys not configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /trader/live-portfolio:
    get:
      operationId: getLivePortfolio
      tags: [trader]
      summary: Get live trading portfolio and exchange balances
      responses:
        "200":
          description: Live portfolio snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivePortfolioSnapshot"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /trader/exchange/balances:
    get:
      operationId: getExchangeBalances
      tags: [trader]
      summary: Fetch raw balances from Coinbase
      responses:
        "200":
          description: Exchange balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExchangeBalance"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /trader/dex-mode:
    get:
      operationId: getDexMode
      tags: [trader]
      summary: Get DEX trader state
      responses:
        "200":
          description: DEX trader state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DexTraderState"
    post:
      operationId: setDexMode
      tags: [trader]
      summary: Enable or disable DEX trading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DexModeControl"
      responses:
        "200":
          description: Updated DEX trader state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DexTraderState"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /trader/dex-portfolio:
    get:
      operationId: getDexPortfolio
      tags: [trader]
      summary: Get DEX portfolio with on-chain balances and trade history
      responses:
        "200":
          description: DEX portfolio snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DexPortfolioSnapshot"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /trader/scaling:
    get:
      operationId: getScalingConfig
      tags: [trader]
      summary: Get current scaling configuration
      responses:
        "200":
          description: Scaling configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScalingConfig"
    post:
      operationId: setScalingConfig
      tags: [trader]
      summary: Update scaling configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScalingConfig"
      responses:
        "200":
          description: Updated scaling configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScalingConfig"
  /trader/scaling/reset:
    post:
      operationId: resetScalingConfig
      tags: [trader]
      summary: Reset scaling configuration to defaults
      responses:
        "200":
          description: Default scaling configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScalingConfig"
  /trader/dex/balances:
    get:
      operationId: getDexBalances
      tags: [trader]
      summary: Fetch on-chain token balances from Base wallet
      responses:
        "200":
          description: On-chain token balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DexBalances"
        "400":
          description: Wallet not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /trader/status:
    get:
      operationId: getAutoTraderStatus
      tags: [trader]
      summary: Get auto-trader loop status
      responses:
        "200":
          description: Auto-trader loop state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoTraderStatus"
    post:
      operationId: controlAutoTrader
      tags: [trader]
      summary: Start or stop the auto-trader loop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoTraderControl"
      responses:
        "200":
          description: Updated auto-trader state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoTraderStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PortfolioPosition:
      type: object
      properties:
        symbol: { type: string }
        quantity: { type: number }
        avgEntryPrice: { type: number }
        currentPrice: { type: number }
        marketValue: { type: number }
        unrealizedPnl: { type: number }
        unrealizedPnlPercent: { type: number }
        openedAt: { type: string }
      required: [symbol, quantity, avgEntryPrice, currentPrice, marketValue, unrealizedPnl, unrealizedPnlPercent, openedAt]
    PortfolioTrade:
      type: object
      properties:
        id: { type: number }
        symbol: { type: string }
        side: { type: string }
        quantity: { type: number }
        price: { type: number }
        value: { type: number }
        realizedPnl: { type: number, nullable: true }
        timestamp: { type: string }
      required: [id, symbol, side, quantity, price, value, timestamp]
    PortfolioSnapshot:
      type: object
      properties:
        startingCapital: { type: number }
        cash: { type: number }
        equity: { type: number }
        pnl: { type: number }
        pnlPercent: { type: number }
        positions:
          type: array
          items: { $ref: "#/components/schemas/PortfolioPosition" }
        trades:
          type: array
          items: { $ref: "#/components/schemas/PortfolioTrade" }
        totalTrades: { type: number }
        closedTrades: { type: number }
        wins: { type: number }
        losses: { type: number }
        winRate: { type: number }
        totalRealizedPnl: { type: number }
      required: [startingCapital, cash, equity, pnl, pnlPercent, positions, trades, totalTrades, closedTrades, wins, losses, winRate, totalRealizedPnl]
    AutoTraderStatus:
      type: object
      properties:
        isRunning:
          type: boolean
        intervalSeconds:
          type: number
        totalRuns:
          type: number
        signalsGenerated:
          type: number
        lastRun:
          type: string
          nullable: true
        nextRun:
          type: string
          nullable: true
        activeSymbols:
          type: array
          items:
            type: string
        lastSignals:
          type: array
          items:
            $ref: "#/components/schemas/RecentSignal"
        wsStatus:
          type: string
          enum: [DISCONNECTED, CONNECTING, CONNECTED, RECONNECTING]
        dataSource:
          type: string
          enum: [websocket, rest]
      required:
        - isRunning
        - intervalSeconds
        - totalRuns
        - signalsGenerated
        - activeSymbols
        - lastSignals
        - wsStatus
        - dataSource
    AutoTraderControl:
      type: object
      properties:
        action:
          type: string
          enum: [start, stop]
        intervalSeconds:
          type: number
      required:
        - action
    RecentSignal:
      type: object
      properties:
        symbol:
          type: string
        signal:
          type: string
        confidence:
          type: number
        price:
          type: number
        composite:
          type: number
        timestamp:
          type: string
      required:
        - symbol
        - signal
        - confidence
        - price
        - composite
        - timestamp
    SignalResponse:
      type: object
      properties:
        signal:
          type: string
          enum: [BUY, SELL, HOLD]
        confidence:
          type: number
        price:
          type: number
        symbol:
          type: string
        timeframe:
          type: string
        timestamp:
          type: string
        features:
          $ref: "#/components/schemas/Features"
        factorScores:
          $ref: "#/components/schemas/FactorScores"
        backtest:
          $ref: "#/components/schemas/BacktestStats"
      required:
        - signal
        - confidence
        - price
        - symbol
        - timeframe
        - timestamp
        - features
        - factorScores
        - backtest
    Features:
      type: object
      properties:
        returns:
          type: number
        ma20:
          type: number
        emaFast:
          type: number
        emaSlow:
          type: number
        volatility:
          type: number
        rsi:
          type: number
        macd:
          type: number
        macdSignal:
          type: number
        macdHist:
          type: number
        bbUpper:
          type: number
        bbLower:
          type: number
        bbPct:
          type: number
        atr:
          type: number
        stochK:
          type: number
        stochD:
          type: number
        momentum:
          type: number
        zScore:
          type: number
        volumeTrend:
          type: number
      required:
        - returns
        - ma20
        - emaFast
        - emaSlow
        - volatility
        - rsi
        - macd
        - macdSignal
        - macdHist
        - bbUpper
        - bbLower
        - bbPct
        - atr
        - stochK
        - stochD
        - momentum
        - zScore
        - volumeTrend
    FactorScores:
      type: object
      properties:
        trend:
          type: number
        momentum:
          type: number
        meanReversion:
          type: number
        volatility:
          type: number
        volume:
          type: number
        composite:
          type: number
      required:
        - trend
        - momentum
        - meanReversion
        - volatility
        - volume
        - composite
    BacktestStats:
      type: object
      properties:
        winRate:
          type: number
        avgReturn:
          type: number
        sharpeRatio:
          type: number
        maxDrawdown:
          type: number
        totalTrades:
          type: number
        profitFactor:
          type: number
      required:
        - winRate
        - avgReturn
        - sharpeRatio
        - maxDrawdown
        - totalTrades
        - profitFactor
    SignalRecord:
      type: object
      properties:
        id:
          type: number
        signal:
          type: string
        confidence:
          type: number
        price:
          type: number
        symbol:
          type: string
        timeframe:
          type: string
        returns:
          type: number
        ma:
          type: number
        volatility:
          type: number
        rsi:
          type: number
        macd:
          type: number
        createdAt:
          type: string
      required:
        - id
        - signal
        - confidence
        - price
        - symbol
        - timeframe
        - returns
        - ma
        - volatility
        - rsi
        - macd
        - createdAt
    Candle:
      type: object
      properties:
        time:
          type: number
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number
      required:
        - time
        - open
        - high
        - low
        - close
        - volume
    ExchangeBalance:
      type: object
      properties:
        currency: { type: string }
        total: { type: number }
        free: { type: number }
        used: { type: number }
      required: [currency, total, free, used]
    LivePosition:
      type: object
      properties:
        symbol: { type: string }
        quantity: { type: number }
        avgEntryPrice: { type: number }
        openedAt: { type: string }
      required: [symbol, quantity, avgEntryPrice, openedAt]
    LiveTrade:
      type: object
      properties:
        id: { type: number }
        symbol: { type: string }
        side: { type: string }
        quantity: { type: number }
        price: { type: number }
        value: { type: number }
        realizedPnl: { type: number, nullable: true }
        timestamp: { type: string }
      required: [id, symbol, side, quantity, price, value, timestamp]
    LiveTraderState:
      type: object
      properties:
        enabled: { type: boolean }
        configured: { type: boolean }
        budgetUsdc: { type: number }
        positions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/LivePosition"
      required: [enabled, configured, budgetUsdc, positions]
    LiveModeControl:
      type: object
      properties:
        enabled: { type: boolean }
        budgetUsdc: { type: number }
    LivePortfolioSnapshot:
      type: object
      properties:
        enabled: { type: boolean }
        configured: { type: boolean }
        budgetUsdc: { type: number }
        freeUsdc: { type: number }
        openPositions:
          type: array
          items: { $ref: "#/components/schemas/LivePosition" }
        trades:
          type: array
          items: { $ref: "#/components/schemas/LiveTrade" }
        totalTrades: { type: number }
        closedTrades: { type: number }
        wins: { type: number }
        losses: { type: number }
        winRate: { type: number }
        totalRealizedPnl: { type: number }
        exchangeBalances:
          type: array
          items: { $ref: "#/components/schemas/ExchangeBalance" }
      required: [enabled, configured, budgetUsdc, freeUsdc, openPositions, trades, totalTrades, closedTrades, wins, losses, winRate, totalRealizedPnl, exchangeBalances]
    DexPosition:
      type: object
      properties:
        symbol: { type: string }
        quantity: { type: number }
        avgEntryPrice: { type: number }
        openedAt: { type: string }
      required: [symbol, quantity, avgEntryPrice, openedAt]
    DexBalances:
      type: object
      properties:
        address: { type: string }
        usdc: { type: number }
        weth: { type: number }
        cbbtc: { type: number }
        ethGas: { type: number }
      required: [address, usdc, weth, cbbtc, ethGas]
    DexTraderState:
      type: object
      properties:
        enabled: { type: boolean }
        configured: { type: boolean }
        walletAddress: { type: string, nullable: true }
        budgetUsdc: { type: number }
        totalTrades: { type: number }
        positions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DexPosition"
      required: [enabled, configured, walletAddress, budgetUsdc, totalTrades, positions]
    DexModeControl:
      type: object
      properties:
        enabled: { type: boolean }
        budgetUsdc: { type: number }
    DexTrade:
      type: object
      properties:
        id: { type: number }
        symbol: { type: string }
        side: { type: string }
        quantity: { type: number }
        price: { type: number }
        value: { type: number }
        realizedPnl: { type: number, nullable: true }
        timestamp: { type: string }
      required: [id, symbol, side, quantity, price, value, timestamp]
    DexPortfolioSnapshot:
      type: object
      properties:
        enabled: { type: boolean }
        configured: { type: boolean }
        walletAddress: { type: string, nullable: true }
        budgetUsdc: { type: number }
        openPositions:
          type: array
          items: { $ref: "#/components/schemas/DexPosition" }
        balances:
          $ref: "#/components/schemas/DexBalances"
          nullable: true
        trades:
          type: array
          items: { $ref: "#/components/schemas/DexTrade" }
        totalTrades: { type: number }
        closedTrades: { type: number }
        wins: { type: number }
        losses: { type: number }
        winRate: { type: number }
        totalPnl: { type: number }
      required: [enabled, configured, walletAddress, budgetUsdc, openPositions, trades, totalTrades, closedTrades, wins, losses, winRate, totalPnl]
    ScalingConfig:
      type: object
      properties:
        enabled:        { type: boolean }
        mode:
          type: string
          enum: [fixed, tiered, linear]
        stopLossPct:      { type: number }
        takeProfitPct:    { type: number }
        trailingStop:     { type: boolean }
        scaleInEnabled:   { type: boolean }
        maxScaleIns:      { type: number }
        autoCompound:     { type: boolean }
        compoundFraction: { type: number }
      required: [enabled, mode, stopLossPct, takeProfitPct, trailingStop, scaleInEnabled, maxScaleIns, autoCompound, compoundFraction]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
